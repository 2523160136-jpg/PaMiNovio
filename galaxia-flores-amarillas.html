<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas</title>
<style>
  :root{
    --gold:#ffd54a;
    --gold-soft:#ffdf7e;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:#05040a;
    overflow:hidden;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #scene{
    position:relative;
    width:100%;
    height:100vh;
    background:radial-gradient(ellipse at 50% 60%, #1a1305 0%, #0a0710 45%, #050409 100%);
    overflow:hidden;
  }

  #three-container{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    cursor:grab;
  }
  #three-container:active{ cursor:grabbing; }
  #three-container canvas{ display:block; touch-action:none; }

  .title{
    position:absolute;
    top:6%;
    left:0; right:0;
    text-align:center;
    z-index:5;
    padding:0 16px;
    pointer-events:none;
  }
  .title h1{
    margin:0;
    font-family:'Brush Script MT', 'Segoe Script', cursive;
    font-weight:400;
    font-size:clamp(26px, 6vw, 42px);
    color:var(--gold-soft);
    text-shadow:
      0 0 8px rgba(255,213,74,.9),
      0 0 22px rgba(255,213,74,.6),
      0 0 40px rgba(255,180,0,.4);
    animation:glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ text-shadow:0 0 8px rgba(255,213,74,.85),0 0 22px rgba(255,213,74,.55),0 0 38px rgba(255,180,0,.35);}
    50%{ text-shadow:0 0 14px rgba(255,224,120,1),0 0 32px rgba(255,213,74,.85),0 0 60px rgba(255,180,0,.55);}
  }

  .msg{
    position:absolute;
    font-size:13px;
    font-weight:600;
    color:#ffe9a8;
    letter-spacing:.4px;
    white-space:nowrap;
    pointer-events:none;
    text-shadow:
      0 0 6px rgba(255,210,90,.9),
      0 0 14px rgba(255,180,40,.7);
    animation:flicker 4s ease-in-out infinite;
    z-index:2;
  }
  @keyframes flicker{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }

  .heart-btn{
    position:fixed;
    bottom:28px;
    right:24px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe27a, #ffb300 70%);
    border:none;
    box-shadow:0 0 18px rgba(255,190,0,.85), 0 0 40px rgba(255,150,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    cursor:pointer;
    z-index:10;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.1); }
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(2,1,5,.92);
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .overlay.show{ display:flex; }
  .card{
    max-width:420px;
    width:100%;
    background:linear-gradient(160deg, rgba(40,30,5,.6), rgba(10,8,4,.85));
    border:1px solid rgba(255,213,74,.4);
    border-radius:18px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,190,0,.25);
    color:var(--gold-soft);
    position:relative;
  }
  .card h2{
    font-family:'Brush Script MT','Segoe Script',cursive;
    font-size:28px;
    margin:0 0 12px;
    color:var(--gold);
    text-shadow:0 0 10px rgba(255,213,74,.8);
  }
  .card p{
    font-size:15px;
    line-height:1.6;
    margin:0 0 8px;
    color:#ffe9b3;
  }
  .close-btn{
    margin-top:16px;
    background:none;
    border:1px solid rgba(255,213,74,.6);
    color:var(--gold-soft);
    padding:8px 20px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
  }
  .close-btn:active{ background:rgba(255,213,74,.15); }

  .back-btn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:10;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,213,74,.5);
    color:var(--gold-soft);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    text-decoration:none;
  }

  .hint{
    position:fixed;
    bottom:16px;
    left:16px;
    z-index:10;
    color:rgba(255,224,150,.55);
    font-size:12px;
    pointer-events:none;
    animation:flicker 5s ease-in-out infinite;
  }
</style>
</head>
<body>

  <div id="scene">
    <div id="three-container"></div>

    <!-- Cambia el href a tu página anterior (ej: nosotros.html) -->
    <a class="back-btn" href="nosotros.html">← Volver</a>

    <div class="title">
      <h1>Feliz Día de las Flores<br>Amarillas 🌻</h1>
    </div>

    <div id="messages"></div>

    <p class="hint">Arrastra para girar · pellizca / rueda para acercar</p>

    <button class="heart-btn" id="heartBtn">💛</button>

    <div class="overlay" id="overlay">
      <div class="card">
        <h2>Para ti 💛</h2>
        <p>En este Día de las Flores Amarillas quiero recordarte lo especial que eres.</p>
        <p>Que este día brille tan bonito como este cielo dorado, igual que tú.</p>
        <button class="close-btn" id="closeBtn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Three.js (build UMD, versión fija r128) + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (function(){
    const container = document.getElementById('three-container');

    // ---------------- Escena, cámara, renderer ----------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------------- Controles de arrastre (rotar / zoom) ----------------
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 16;
    controls.maxDistance = 60;
    controls.rotateSpeed = 0.55;
    controls.target.set(0, 0, 0);

    // ---------------- Textura de partícula (glow suave) ----------------
    function makeGlowTexture(){
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      grad.addColorStop(0, 'rgba(255,250,220,1)');
      grad.addColorStop(0.35, 'rgba(255,210,90,0.9)');
      grad.addColorStop(1, 'rgba(255,180,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,size,size);
      return new THREE.CanvasTexture(canvas);
    }
    const glowTexture = makeGlowTexture();

    // ================================================================
    //  FIGURA CENTRAL: partículas que alternan CORAZÓN <-> FLOR
    // ================================================================
    const PARTICLE_COUNT = 1500;

    // ---- Forma 1: Corazón (orientado correctamente hacia arriba) ----
    function heartShapePoint(){
      const t = Math.random() * Math.PI * 2;
      // Fórmula estándar del corazón. OJO: sin invertir el signo de "y",
      // así la punta queda abajo y las curvas redondeadas arriba (vertical, correcto).
      const rawX = 16 * Math.pow(Math.sin(t), 3);
      const rawY = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const scale = 0.75 + Math.random()*0.3; // grosor del contorno
      const jitter = (Math.random()-0.5) * 1.4;
      return {
        x: rawX * scale + jitter,
        y: rawY * scale + jitter,
        z: (Math.random()-0.5) * 5
      };
    }

    // ---- Forma 2: Flor amarilla (centro + pétalos radiales) ----
    const PETAL_COUNT = 12;
    const CENTER_RATIO = 0.18;
    function flowerShapePoint(index){
      const centerCount = Math.floor(PARTICLE_COUNT * CENTER_RATIO);
      if(index < centerCount){
        // Centro de la flor (disco)
        const r = Math.sqrt(Math.random()) * 3.4;
        const a = Math.random() * Math.PI * 2;
        return {
          x: Math.cos(a) * r,
          y: Math.sin(a) * r,
          z: (Math.random()-0.5) * 1.5
        };
      } else {
        // Pétalos
        const petalIndex = (index - centerCount) % PETAL_COUNT;
        const angle = (petalIndex / PETAL_COUNT) * Math.PI * 2;
        const along = Math.random();               // 0 = base del pétalo, 1 = punta
        const petalLen = 12.5;
        const petalWidth = 4.2;
        const innerR = 2.2;
        const taper = 1 - along*0.8;                // se angosta hacia la punta
        const u = along * petalLen;
        const v = (Math.random()-0.5) * petalWidth * taper;
        const x = Math.cos(angle)*(innerR+u) - Math.sin(angle)*v;
        const y = Math.sin(angle)*(innerR+u) + Math.cos(angle)*v;
        return { x, y, z: (Math.random()-0.5)*1.5 };
      }
    }

    // Precalcular ambas formas para cada partícula (mapeo 1 a 1 => morph suave)
    const heartTargets  = new Float32Array(PARTICLE_COUNT*3);
    const flowerTargets = new Float32Array(PARTICLE_COUNT*3);
    const currentPos    = new Float32Array(PARTICLE_COUNT*3);

    for(let i=0; i<PARTICLE_COUNT; i++){
      const h = heartShapePoint();
      heartTargets[i*3]   = h.x;
      heartTargets[i*3+1] = h.y;
      heartTargets[i*3+2] = h.z;

      const f = flowerShapePoint(i);
      flowerTargets[i*3]   = f.x;
      flowerTargets[i*3+1] = f.y;
      flowerTargets[i*3+2] = f.z;

      currentPos[i*3]   = h.x;
      currentPos[i*3+1] = h.y;
      currentPos[i*3+2] = h.z;
    }

    const figureGroup = new THREE.Group();
    scene.add(figureGroup);

    const figureGeo = new THREE.BufferGeometry();
    figureGeo.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));

    const figureMat = new THREE.PointsMaterial({
      size: 1.15,
      map: glowTexture,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      color: 0xffdd77,
      sizeAttenuation: true
    });

    const figurePoints = new THREE.Points(figureGeo, figureMat);
    figureGroup.add(figurePoints);

    // ---------------- Ciclo corazón <-> flor ----------------
    // holdTime: segundos que se queda quieta cada forma. transTime: duración de la transformación.
    const holdTime = 4.5;
    const transTime = 2.2;
    const period = 2 * (holdTime + transTime);

    function smoothstep(x){
      x = Math.max(0, Math.min(1, x));
      return x*x*(3 - 2*x);
    }

    function morphFactorAt(t){
      const tt = t % period;
      if (tt < holdTime) return 0;                                   // corazón fijo
      if (tt < holdTime + transTime) return smoothstep((tt-holdTime)/transTime); // -> flor
      if (tt < 2*holdTime + transTime) return 1;                      // flor fija
      return 1 - smoothstep((tt - 2*holdTime - transTime)/transTime); // -> corazón
    }

    // ---------------- Polvo estelar ambiental ----------------
    const dustCount = 900;
    const dustPositions = new Float32Array(dustCount * 3);
    for(let i=0;i<dustCount;i++){
      const radius = 40 + Math.random()*60;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      dustPositions[i*3]   = radius * Math.sin(phi) * Math.cos(theta);
      dustPositions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.5;
      dustPositions[i*3+2] = radius * Math.cos(phi) - 20;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.6,
      map: glowTexture,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      color: 0xffcf6b,
      opacity: 0.6
    });
    const dustPoints = new THREE.Points(dustGeo, dustMat);
    scene.add(dustPoints);

    // ---------------- Anillos de luz debajo de la figura ----------------
    const rings = [];
    for(let i=0;i<3;i++){
      const geo = new THREE.RingGeometry(9 + i*2.2, 9.4 + i*2.2, 80);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffb32e,
        transparent: true,
        opacity: 0.10 + i*0.02,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const ring = new THREE.Mesh(geo, mat);
      ring.rotation.x = Math.PI/2 + 0.15;
      ring.position.y = -10;
      scene.add(ring);
      rings.push(ring);
    }

    // ---------------- Ramos de girasoles flotantes (sprites) ----------------
    // Cada ramo es UNA textura dibujada en canvas: varios tallos + girasoles +
    // hojas + un moño en la base. Así se ve como un ramo real, no flores sueltas.
    function makeBouquetTexture(){
      const size = 220;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');

      const baseX = size * 0.5;
      const baseY = size * 0.94;

      const flowerCount = 4 + Math.floor(Math.random()*3); // 4 a 6 girasoles por ramo
      const stems = [];
      for(let i=0; i<flowerCount; i++){
        const spread = (i - (flowerCount-1)/2) / flowerCount; // -0.5 .. 0.5
        const angle = spread * 1.15 + (Math.random()-0.5)*0.15; // abanico
        const length = size * (0.52 + Math.random()*0.14);
        const tipX = baseX + Math.sin(angle) * length * 0.55;
        const tipY = baseY - Math.cos(angle) * length;
        stems.push({ tipX, tipY, angle });
      }

      // Tallos (curvas suaves color verde oliva)
      stems.forEach(s => {
        ctx.strokeStyle = '#4a6b1f';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.quadraticCurveTo(baseX + s.angle*20, (baseY + s.tipY)/2, s.tipX, s.tipY + 14);
        ctx.stroke();
      });

      // Hojitas a lo largo de un par de tallos
      ctx.font = (size*0.13) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      [0, Math.floor(stems.length/2)].forEach(idx=>{
        const s = stems[idx];
        if(!s) return;
        const midX = (baseX + s.tipX)/2 + (Math.random()-0.5)*10;
        const midY = (baseY + s.tipY)/2;
        ctx.save();
        ctx.translate(midX, midY);
        ctx.rotate((Math.random()-0.5)*0.8);
        ctx.fillText('🍃', 0, 0);
        ctx.restore();
      });

      // Girasoles en la punta de cada tallo
      const flowerFont = size * (0.24 + Math.random()*0.04);
      ctx.font = flowerFont + 'px serif';
      stems.forEach(s=>{
        ctx.save();
        ctx.translate(s.tipX, s.tipY);
        ctx.rotate((Math.random()-0.5)*0.35);
        ctx.fillText('🌻', 0, 0);
        ctx.restore();
      });

      // Moño / lazo amarrando la base del ramo
      ctx.font = (size*0.20) + 'px serif';
      ctx.fillText('🎀', baseX, baseY + 4);

      return new THREE.CanvasTexture(canvas);
    }

    const bouquets = [];
    const bouquetCount = 20;
    for(let i=0; i<bouquetCount; i++){
      const tex = makeBouquetTexture();
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, rotation: (Math.random()-0.5)*0.25 });
      const sprite = new THREE.Sprite(mat);
      const scale = 6 + Math.random()*3.5;
      sprite.scale.set(scale, scale, 1);

      const angle = (i / bouquetCount) * Math.PI * 2 + Math.random()*0.3;
      const radius = 15 + Math.random()*14;
      sprite.position.set(
        Math.cos(angle) * radius,
        (Math.random()-0.5) * 20 - 2,
        Math.sin(angle) * radius - 8
      );
      sprite.userData.baseY = sprite.position.y;
      sprite.userData.phase = Math.random()*Math.PI*2;
      scene.add(sprite);
      bouquets.push(sprite);
    }

    // ---------------- Animación ----------------
    const clock = new THREE.Clock();
    const posAttr = figureGeo.attributes.position;

    function animate(){
      const t = clock.getElapsedTime();

      // Morph corazón <-> flor
      const m = morphFactorAt(t);
      const arr = posAttr.array;
      for(let i=0; i<PARTICLE_COUNT; i++){
        const i3 = i*3;
        arr[i3]   = heartTargets[i3]   + (flowerTargets[i3]   - heartTargets[i3])   * m;
        arr[i3+1] = heartTargets[i3+1] + (flowerTargets[i3+1] - heartTargets[i3+1]) * m;
        arr[i3+2] = heartTargets[i3+2] + (flowerTargets[i3+2] - heartTargets[i3+2]) * m;
      }
      posAttr.needsUpdate = true;

      // Suave "respiración" + ligera oscilación (sin dar vuelta completa,
      // así siempre se ve derecha; el usuario controla la vista con el arrastre)
      const breathe = 1 + Math.sin(t*1.3) * 0.025;
      figureGroup.scale.set(breathe, breathe, breathe);
      figureGroup.rotation.y = Math.sin(t*0.25) * 0.12;

      dustPoints.rotation.y = t * 0.015;

      rings.forEach((r, i) => {
        r.rotation.z = t * (0.1 + i*0.03);
      });

      bouquets.forEach(s => {
        s.position.y = s.userData.baseY + Math.sin(t*0.7 + s.userData.phase) * 1.4;
      });

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  })();
  </script>

  <script>
  // ---------------- Mensajes tenues de fondo ----------------
  const phrases = [
    'contigo todo es mejor', 'eres mi rayito de sol', 'gracias por existir',
    'me alegras el día', 'siempre pensando en ti', 'una sonrisa para ti',
    'brillas como el girasol', 'hoy es tu día', 'gracias por tanto',
    'mi persona favorita', 'con todo mi cariño', 'nunca lo olvides: te quiero',
    'un abrazo dorado', 'que la vida te sonría', 'eres luz'
  ];
  const msgContainer = document.getElementById('messages');
  phrases.forEach((txt) => {
    const el = document.createElement('div');
    el.className = 'msg';
    el.textContent = txt;
    el.style.top = (Math.random()*88 + 4) + '%';
    el.style.left = (Math.random()*80 + 3) + '%';
    el.style.animationDelay = (Math.random()*4) + 's';
    el.style.animationDuration = (3.5 + Math.random()*3) + 's';
    msgContainer.appendChild(el);
  });

  // ---------------- Botón de corazón ----------------
  const overlay = document.getElementById('overlay');
  document.getElementById('heartBtn').addEventListener('click', () => {
    overlay.classList.add('show');
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('show');
  });
  </script>
</body>
</html>
